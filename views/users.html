<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - ModelSecurity</title>
    <!-- Estilos CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="container mt-4" id="usersView">
        <div class="list-header">
            <h1 class="section-title">Gestión de Usuarios</h1>
            <div class="list-actions">
                <button id="btnNewUser" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i> Nuevo Usuario
                </button>
            </div>
        </div>

        <!-- Barra de búsqueda -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="search-container">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" id="searchUser" class="form-control"
                                    placeholder="Buscar usuarios...">
                                <button class="btn btn-outline-secondary" type="button" id="btnClearSearch">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 text-md-end mt-3 mt-md-0">
                        <button class="btn btn-outline-secondary me-2" id="btnRefresh">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refrescar
                        </button>
                        <div class="btn-group" role="group">
                            <button class="btn btn-outline-primary" id="btnFilterAll">Todos</button>
                            <button class="btn btn-outline-success" id="btnFilterActive">Activos</button>
                            <button class="btn btn-outline-danger" id="btnFilterInactive">Inactivos</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de usuarios -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Lista de Usuarios</h5>
                <span class="badge bg-primary" id="userCount">0 usuarios</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th><i class="bi bi-hash me-1"></i> ID</th>
                                <th><i class="bi bi-person-badge me-1"></i> Usuario</th>
                                <th><i class="bi bi-envelope me-1"></i> Email</th>
                                <th><i class="bi bi-person me-1"></i> Persona</th>
                                <th><i class="bi bi-circle-fill me-1"></i> Estado</th>
                                <th class="text-center"><i class="bi bi-gear me-1"></i> Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersList">
                            <!-- La lista de usuarios se cargará dinámicamente -->
                            <tr>
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <nav aria-label="Paginación">
                    <ul class="pagination justify-content-center mb-0" id="userPagination">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Anterior</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Siguiente</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Formulario para crear/editar usuarios (inicialmente oculto) -->
        <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <form id="userForm">
                        <div class="modal-header">
                            <h5 class="modal-title" id="userFormTitle">Nuevo Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="alert alert-danger d-none" id="userFormMsg"></div>

                            <input type="hidden" id="userId" name="id">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label required-field">Nombre de Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" id="username" name="username" class="form-control" required>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label required-field">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="email" name="email" class="form-control" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="personId" class="form-label required-field">Persona</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                                        <select id="personId" name="personId" class="form-select" required>
                                            <option value="">Seleccione una persona</option>
                                            <!-- Las opciones se cargarán dinámicamente -->
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3 password-field">
                                    <label for="password" class="form-label required-field">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                                        <input type="password" id="password" name="password" class="form-control"
                                            minlength="6">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <small class="form-text text-muted">Mínimo 6 caracteres</small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="active" name="active">
                                    <label class="form-check-label" for="active">Usuario activo</label>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" id="btnSaveUser" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts de la aplicación -->
    <script src="../js/utils/constants.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/api/api-config.js"></script>
    <script src="../js/api/api-service.js"></script>
    <script src="../js/api/auth-service.js"></script>
    <script src="../js/api/user-service.js"></script>
    <script src="../js/api/person-service.js"></script>
    <script src="../js/controllers/user-controller.js"></script>
    <script>
        // Inicializar controlador cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            UserController.init();
        });
    </script>
</body>

</html>
