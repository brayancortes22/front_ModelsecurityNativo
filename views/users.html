<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - ModelSecurity</title>
    <!-- Estilos CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container mt-4" id="usersView">
        <h2 class="mb-4">Gestión de Usuarios</h2>
        
        <!-- Barra de búsqueda y botón de nuevo usuario -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchUser" class="form-control" placeholder="Buscar usuarios...">
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button id="btnNewUser" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo Usuario
                </button>
            </div>
        </div>
        
        <!-- Tabla de usuarios -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Persona</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersList">
                            <!-- La lista de usuarios se cargará dinámicamente -->
                            <tr>
                                <td colspan="6" class="text-center">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Formulario para crear/editar usuarios (inicialmente oculto) -->
        <form id="userForm" class="card mb-4 d-none">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="userFormTitle">Nuevo Usuario</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-danger d-none" id="userFormMsg"></div>
                
                <input type="hidden" id="userId" name="id">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Nombre de Usuario *</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="personId" class="form-label">Persona *</label>
                        <select id="personId" name="personId" class="form-select" required>
                            <option value="">Seleccione una persona</option>
                            <!-- Las opciones se cargarán dinámicamente -->
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3 password-field">
                        <label for="password" class="form-label">Contraseña *</label>
                        <input type="password" id="password" name="password" class="form-control" minlength="6">
                        <small class="form-text text-muted">Mínimo 6 caracteres</small>
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" id="active" name="active" class="form-check-input">
                    <label class="form-check-label" for="active">Activo</label>
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" id="btnCancelUser" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="btnSaveUser" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </form>
    </div>
    
    <!-- JavaScript Libraries desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts de la aplicación -->
    <script src="../js/utils/constants.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/api/api-config.js"></script>
    <script src="../js/api/api-service.js"></script>
    <script src="../js/api/auth-service.js"></script>
    <script src="../js/api/user-service.js"></script>
    <script src="../js/api/person-service.js"></script>
    <script src="../js/controllers/user-controller.js"></script>
    <script>
        // Inicializar controlador cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            UserController.init();
        });
    </script>
</body>
</html>
