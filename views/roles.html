<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Roles - ModelSecurity</title>
    <!-- Estilos CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container mt-4" id="rolesView">
        <h2 class="mb-4">Gestión de Roles</h2>
        
        <!-- Barra de búsqueda y botón de nuevo rol -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchRole" class="form-control" placeholder="Buscar roles...">
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button id="btnNewRole" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo Rol
                </button>
            </div>
        </div>
        
        <!-- Tabla de roles -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Tipo de Rol</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="rolesList">
                            <!-- La lista de roles se cargará dinámicamente -->
                            <tr>
                                <td colspan="5" class="text-center">Cargando roles...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Formulario para crear/editar roles (inicialmente oculto) -->
        <form id="roleForm" class="card mb-4 d-none">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="roleFormTitle">Nuevo Rol</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-danger d-none" id="roleFormMsg"></div>
                
                <input type="hidden" id="roleId" name="id">
                
                <div class="mb-3">
                    <label for="typeRol" class="form-label">Tipo de Rol *</label>
                    <input type="text" id="typeRol" name="typeRol" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Descripción</label>
                    <textarea id="description" name="description" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" id="active" name="active" class="form-check-input">
                    <label class="form-check-label" for="active">Activo</label>
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" id="btnCancelRole" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="btnSaveRole" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </form>
    </div>
    
    <!-- JavaScript Libraries desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts de la aplicación -->
    <script src="../js/utils/constants.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/api/api-config.js"></script>
    <script src="../js/api/api-service.js"></script>
    <script src="../js/api/auth-service.js"></script>
    <script src="../js/api/role-service.js"></script>
    <script src="../js/controllers/role-controller.js"></script>
    <script>
        // Inicializar controlador cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            RoleController.init();
        });
    </script>
</body>
</html>
